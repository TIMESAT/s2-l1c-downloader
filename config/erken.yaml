project:
  # All relative paths below are resolved from this root. This value is
  # resolved relative to the directory containing this YAML file.
  root: ".."

study_area:
  name: "Erken"
  geometry: "config/erken.geojson"
  search_feature: "erken-search"
  processing_roi_feature: "erken-processing-roi-5km"

sentinel:
  collection: "sentinel-2-l1c"
  processing_level: "L1C"
  start_date: "2017-01-01"
  # null means the current UTC date at run time; the resolved date is recorded
  # in every effective configuration and run manifest.
  end_date: null
  platform: null
  # T34VCM contains both Erken and its configured 5 km processing ROI.
  tile_id: "T34VCM"
  # Exclude partial-swath products unless their valid-data footprint fully
  # contains the configured Erken lake boundary + 5 km processing ROI.
  require_full_processing_roi_coverage: true
  # Tile cloud percentage is not a reliable proxy for cloud over the lake.
  max_scene_cloud_cover: null

api:
  stac_search_url: "https://stac.dataspace.copernicus.eu/v1/search"
  catalogue_odata_url: "https://catalogue.dataspace.copernicus.eu/odata/v1"
  token_url: "https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token"
  download_base_url: "https://download.dataspace.copernicus.eu/odata/v1"
  request_timeout_seconds: 120
  page_size: 100

download:
  # Keep the local example archive separate from Vombsjön. On Linux/HPC,
  # S2L1C_DOWNLOAD_DIRECTORY can override this path without editing the YAML.
  directory: "data/raw/erken/S2_L1C"
  layout: "tile"
  workers: 2
  retries: 5
  backoff_seconds: 2.0
  chunk_size_mib: 8
  verify_checksum: true
  keep_source_archive: true

catalogue:
  # Erken must not overwrite the Vombsjön catalogue.
  directory: "data/catalogue/erken"
  csv_name: "catalogue.csv"
  parquet_name: "catalogue.parquet"
  stac_name: "catalogue.stac.json"
  write_parquet: true

provenance:
  directory: "data/logs/erken/runs"
